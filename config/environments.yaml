# xiaozhua-agent 环境清单（骨架，跟仓库走）—— 只有结构和占位符
#
# 铁律: 代码/测试/文档/契约禁止写死 URL/appId/版本/路径, 一律引用这里的键;
#       真实值写在本机 config/environments.local.yaml（不进 git），读取时深合并覆盖这里。
#
# 为什么分两个文件: 这个仓库是「装到别人机器上的工具」，不能带客户/本机环境信息
# （主机、命名空间、appId、租户、桶名、凭据路径）。骨架保证 clone 下来就能看懂结构。
default: local-maven

environments:
  local-maven:
    kind: maven
    maven_root: <MAVEN_REPO>/com/<vendor>      # 本地 Maven 仓库根（在 local 覆盖里填）
    note: 离线取证默认环境; artifact 路径 = {maven_root}/{artifact}/{version}/

  # 网关型环境模板（照抄到 environments.local.yaml 里填真值）：
  # <env-name>:
  #   kind: gateway
  #   gateway_base: https://<host>.example.com
  #   gateway_prefix_template: "/service/{appId}"
  #   default_app_id: <按环境填>
  #   udc_image_version: "<部署版本>"
  #   credential: {ref: <credential-ref>, file: <仓库外路径>}

# --- 客户场景证据根（在仓外，2026-10-09 迁出）---
customer_evidence_root: <EVIDENCE_ROOT>/xiaozhua-customer-evidence
customer_evidence_note: >
  客户应用场景证据不进本仓库。需要 golden 样本回放时设
  XIAOZHUA_CUSTOMER_EVIDENCE_ROOT指向此根，
  或直接在 local 覆盖里写真实路径。

# --- projects 段（结构示例；真实项目登记写在 local 覆盖层）---
# 铁律：代码不写死配置值 -> 每 project 只登记引用键 + 来源 dataId/group/tenant，
#       值走 Nacos 只读取，不写进仓库。
projects: {}

# --- nacos_endpoints（结构示例）---
# nacos_endpoints:
#   <endpoint-ref>:
#     kind: aliyun-mse
#     host_hint: <host>
#     port: 8848
#     protocol: http
#     readonly: true
#     credential: {ref: <credential-ref>, file: "<仓库外路径, git 忽略>"}
nacos_endpoints: {}
